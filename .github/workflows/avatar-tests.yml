name: Avatar service safety tests
on:
  push:
    paths:
      - 'experimental-service/**'
      - '.github/workflows/avatar-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local simulation tests
        run: node --test experimental-service/server.test.mjs
