name: Avatar service safety tests
on:
  push:
    paths:
      - 'index.html'
      - 'experimental-service/**'
      - '.github/workflows/avatar-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local simulation tests
        run: node --test experimental-service/*.test.mjs
  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify private local setup and Windows file permissions
        run: node --test experimental-service/setup-local-pilot.test.mjs experimental-service/pilot-real-server.test.mjs
