name: Avatar browser simulation
on:
  push:
    branches: ['feat/avatar-interactive-local', 'feat/avatar-messaging-simulation']
    paths:
      - 'index.html'
      - 'experimental-service/**'
      - '.github/workflows/avatar-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/avatar-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: technologies-formation/catalogue-formations
          ref: bbc7ed98138c998684bdab350b898b0dc4b56666
          path: .contract-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling outside the project
        run: npm install --prefix "$RUNNER_TEMP/avatar-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Install Chromium and system dependencies
        timeout-minutes: 3
        run: node "$RUNNER_TEMP/avatar-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise the local questionnaire on desktop and mobile
        env:
          AVATAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/avatar-browser/node_modules/playwright/index.mjs
          AVATAR_CATALOGUE_MODULE: .contract-source/server/profileReferences.mjs
        run: node experimental-service/visual-check.mjs
      - name: Verify summary after mobile and desktop resizing
        env:
          AVATAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/avatar-browser/node_modules/playwright/index.mjs
        run: node experimental-service/summary-resize-browser-check.mjs
      - name: Verify the opt-in messaging simulation
        env:
          AVATAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/avatar-browser/node_modules/playwright/index.mjs
        run: node experimental-service/messaging-browser-check.mjs
      - name: Verify the isolated fictitious dialogue interface
        env:
          AVATAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/avatar-browser/node_modules/playwright/index.mjs
        run: node experimental-service/dialogue-browser-check.mjs
      - name: Verify real dialogue assembly using fake transport only
        env:
          AVATAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/avatar-browser/node_modules/playwright/index.mjs
        run: node experimental-service/dialogue-real-browser-check.mjs
      - name: Verify real pathway messaging using fake catalogue and dialogue transports
        env:
          AVATAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/avatar-browser/node_modules/playwright/index.mjs
        run: node experimental-service/dialogue-pathway-browser-check.mjs
      - name: Verify three fixed validation cases without paid calls
        env:
          AVATAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/avatar-browser/node_modules/playwright/index.mjs
        run: node experimental-service/validation-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avatar-browser-simulation
          path: visual-check/
          if-no-files-found: warn
          retention-days: 14
